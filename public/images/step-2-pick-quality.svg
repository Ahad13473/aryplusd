<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t2">
  <title id="t2">Step 2: choose a video quality from 240p to 4K, each with its file size</title>
  <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064e3b"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
  <rect width="480" height="300" rx="20" fill="url(#g2)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(40 60)">
      <rect width="124" height="78" rx="10" fill="#111827" stroke="#1f2937"/><text x="14" y="30" fill="#f9fafb" font-size="17" font-weight="700">1080p</text><text x="14" y="50" fill="#9ca3af" font-size="11">Full HD</text><text x="14" y="66" fill="#d1d5db" font-size="12">~443 MB</text>
      <rect x="86" y="10" width="30" height="14" rx="3" fill="#059669"/><text x="101" y="21" fill="#fff" font-size="8" font-weight="700" text-anchor="middle">BEST</text>
    </g>
    <g transform="translate(178 60)"><rect width="124" height="78" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/><text x="14" y="30" fill="#f9fafb" font-size="17" font-weight="700">✓ 720p</text><text x="14" y="50" fill="#a7f3d0" font-size="11">HD</text><text x="14" y="66" fill="#ecfdf5" font-size="12">~222 MB</text></g>
    <g transform="translate(316 60)"><rect width="124" height="78" rx="10" fill="#111827" stroke="#1f2937"/><text x="14" y="30" fill="#f9fafb" font-size="17" font-weight="700">480p</text><text x="14" y="50" fill="#9ca3af" font-size="11">Standard</text><text x="14" y="66" fill="#d1d5db" font-size="12">~124 MB</text></g>
    <g transform="translate(40 152)"><rect width="124" height="78" rx="10" fill="#111827" stroke="#1f2937"/><text x="14" y="30" fill="#f9fafb" font-size="17" font-weight="700">240p</text><text x="14" y="50" fill="#9ca3af" font-size="11">Data saver</text><text x="14" y="66" fill="#d1d5db" font-size="12">~57 MB</text></g>
    <g transform="translate(178 152)"><rect width="124" height="78" rx="10" fill="#111827" stroke="#1f2937"/><text x="14" y="30" fill="#f9fafb" font-size="17" font-weight="700">2160p</text><text x="14" y="50" fill="#9ca3af" font-size="11">4K Ultra HD</text><text x="14" y="66" fill="#d1d5db" font-size="12">~1.4 GB</text></g>
    <g transform="translate(316 170)"><rect width="124" height="42" rx="10" fill="#059669"/><text x="62" y="27" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⬇ Download 720p</text></g>
  </g>
  <circle cx="440" cy="40" r="22" fill="#10b981"/><text x="440" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text>
</svg>
